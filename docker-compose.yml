version: "3.8"

x-common-env: &common-env
  PUID: 1000
  PGID: 1000
  TZ: America/Sao_Paulo

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ./config/jellyfin:/config
      # Mapeamento exato dos seus HDs
      - "D:/Filmes:/data/d_filmes"
      - "D:/TV:/data/d_tv"
      - "E:/Filmes 2:/data/e_filmes2"
      - "E:/TV 2:/data/e_tv2"
      - "F:/filmes 2:/data/f_filmes2"
      - "F:/series 2:/data/f_series2"
      # Pastas para o plugin Gelato jogar as mídias virtuais importadas (stubs)
      - ./config/gelato/movies:/tmp/gelato/movies
      - ./config/gelato/series:/tmp/gelato/series
    ports:
      - 8096:8096
    restart: unless-stopped
    networks:
      - media_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ./config/radarr:/config
      - "D:/Filmes:/data/d_filmes"
      - "E:/Filmes 2:/data/e_filmes2"
      - "F:/filmes 2:/data/f_filmes2"
      - "E:/Downloads:/data/downloads"
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - media_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ./config/sonarr:/config
      - "D:/TV:/data/d_tv"
      - "E:/TV 2:/data/e_tv2"
      - "F:/series 2:/data/f_series2"
      - "E:/Downloads:/data/downloads"
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media_net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./config/qbittorrent:/config
      - "E:/Downloads:/data/downloads"
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - media_net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - media_net

  # Seerr: sucessor do Jellyseerr/Overseerr. Requer init: true (o container nao traz mais init proprio)
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    networks:
      - media_net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Sao_Paulo
    ports:
      - 8191:8191
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - media_net
  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    environment:
      <<: *common-env
      SECRET_KEY: ${AIOSTREAMS_SECRET_KEY:?defina AIOSTREAMS_SECRET_KEY no .env}
      BASE_URL: "http://localhost:3040"
    volumes:
      - ./config/aiostreams:/app/data
    ports:
      # Corrigido: expõe a 3040 no seu PC, mas aponta para a 3000 dentro do container
      - 3040:3000
    restart: unless-stopped
    networks:
      - media_net

  # Proxy de TV ao vivo: filtra/organiza listas M3U + guia XMLTV e entrega ao Jellyfin
  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    environment:
      <<: *common-env
    volumes:
      - ./config/threadfin/conf:/home/threadfin/conf
      - ./config/threadfin/temp:/tmp/threadfin
    ports:
      - 34400:34400
    restart: unless-stopped
    networks:
      - media_net

networks:
  media_net:
    driver: bridge
